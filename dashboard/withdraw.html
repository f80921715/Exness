<!DOCTYPE html>
<html lang="en" :class="{ 'dark': $store.theme.dark }" x-data>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Profits - EXNESS</title>
    <link rel="icon" type="image/png" href="../assets/images/title-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="../assets/js/tailwindcss.js"></script>
    <script>
        if (!localStorage.getItem('theme')) localStorage.setItem('theme', 'dark');
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: { 500: '#FFD100', 600: '#E5BC00' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/lucide.min.js"></script>
    <script src="../assets/js/icons.js"></script>
    <script defer src="../assets/js/alpine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../assets/js/supabase-client.js" defer></script>
    <script src="../assets/js/supabase-dashboard.js" defer></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('theme', {
                dark: localStorage.getItem('theme') === 'dark',
                toggle(trigger) {
                    if (window.toggleDashboardTheme) {
                        window.toggleDashboardTheme(trigger);
                    } else {
                        this.dark = !this.dark;
                        localStorage.setItem('theme', this.dark ? 'dark' : 'light');
                        document.documentElement.classList.toggle('dark', this.dark);
                    }
                }
            });
        });
    </script>
    <script src="../assets/js/fast-nav.js" defer></script>
</head>
<body class="bg-gray-50 dark:bg-[#0c0c0c] text-gray-900 dark:text-gray-100 font-sans antialiased min-h-screen flex transition-colors">
    <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-[#141414] border-r border-gray-200 dark:border-gray-800 flex flex-col justify-between hidden lg:flex">
        <div>
            <div class="h-16 px-6 flex items-center border-b border-gray-100 dark:border-gray-800">
                <a href="../index.html"><img src="../assets/images/exness-logo.png" alt="Logo" class="h-8 w-auto brightness-0 dark:invert"></a>
            </div>
            <nav class="p-4 space-y-1.5 text-sm font-medium">
                <a href="index.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:text-white hover:bg-gray-800/60 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Dashboard</span></a>
                <a href="trades.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:text-white hover:bg-gray-800/60 transition"><i data-lucide="trending-up" class="w-5 h-5"></i><span>Live Trading</span></a>
                <a href="investments.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:text-white hover:bg-gray-800/60 transition"><i data-lucide="pie-chart" class="w-5 h-5"></i><span>Investment Plans</span></a>
                <a href="cars.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:text-white hover:bg-gray-800/60 transition"><i data-lucide="car" class="w-5 h-5"></i><span>Tesla EV Orders</span></a>
                <a href="deposit.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:text-white hover:bg-gray-800/60 transition"><i data-lucide="arrow-down-circle" class="w-5 h-5"></i><span>Deposit Crypto</span></a>
                <a href="withdraw.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl bg-primary-500 text-white font-semibold shadow-md"><i data-lucide="arrow-up-circle" class="w-5 h-5"></i><span>Withdraw Profits</span></a>
                <a href="transactions.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:text-white hover:bg-gray-800/60 transition"><i data-lucide="history" class="w-5 h-5"></i><span>Transactions</span></a>
                <a href="profile.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:text-white hover:bg-gray-800/60 transition"><i data-lucide="shield" class="w-5 h-5"></i><span>Profile & Security</span></a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-100 dark:border-gray-800">
            <a href="javascript:void(0)" data-logout-link class="flex items-center space-x-3 px-3.5 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 rounded-xl transition"><i data-lucide="log-out" class="w-5 h-5"></i><span>Log out</span></a>
        </div>
    </aside>

    <!-- Content -->
    <div class="flex-1 flex flex-col min-w-0" x-data="{ amount: 0, network: 'USDT (TRC-20)', address: '' }">
        <header class="relative min-h-16 bg-white dark:bg-[#141414] border-b border-gray-200 dark:border-gray-800 px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
            <h1 class="hidden sm:block text-base font-bold">Withdraw Funds to Private Wallet</h1>
            <!-- iOS-style mobile title: centered large bold -->
            <span class="sm:hidden absolute left-1/2 -translate-x-1/2 text-base font-bold tracking-tight">Withdraw</span>
            <div class="flex items-center space-x-3 ml-auto">
                <button @click="$store.theme.toggle($event)" class="theme-btn p-2 text-gray-400 hover:text-white rounded-full">
                    <span x-show="!$store.theme.dark"><i data-lucide="sun" class="w-5 h-5"></i></span>
                    <span x-show="$store.theme.dark"><i data-lucide="moon" class="w-5 h-5"></i></span>
                </button>
            </div>
        </header>

        <main class="p-6 sm:p-10 max-w-2xl mx-auto w-full space-y-6">
            <div class="bg-white dark:bg-[#141414] border border-gray-200 dark:border-gray-800 rounded-3xl p-6 sm:p-8 shadow-sm">
                
                <div class="p-4 bg-primary-50 dark:bg-primary-950/40 border border-primary-500/30 rounded-2xl mb-6 flex items-center justify-between">
                    <div>
                        <div class="text-xs text-gray-500">Available For Instant Withdrawal</div>
                        <div data-auth-balance class="text-2xl font-black text-gray-900 dark:text-white mt-0.5">$0.00</div>
                    </div>
                    <span class="text-xs font-bold text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-950/60 px-3 py-1 rounded-full">Available</span>
                </div>

                <form @submit.prevent="if (window.brokerAccount.withdraw({ amount: amount, network: network, address: address })) { amount = ''; address = ''; }" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Withdrawal Method</label>
                        <select x-model="network" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-semibold focus:outline-none focus:border-primary-500">
                            <option value="USDT (TRC-20)">USDT (TRC-20) - Instant / $1 Fee</option>
                            <option value="Bitcoin (BTC)">Bitcoin (BTC) - Network Fee 0.0001 BTC</option>
                            <option value="Ethereum (ETH / ERC-20)">Ethereum (ETH / ERC-20)</option>
                            <option value="Bank Wire (SEPA / Swift EUR & USD)">Bank Wire (SEPA / Swift EUR & USD)</option>
                        </select>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Amount ($ USD)</label>
                            <button type="button" @click="amount = window.brokerAccount.getData().balance || 0" class="text-xs text-primary-500 hover:underline font-bold">Withdraw All</button>
                        </div>
                        <input type="number" step="any" x-model="amount" required min="1" placeholder="e.g. 500" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-base font-bold focus:outline-none focus:border-primary-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Destination Wallet Address</label>
                        <input type="text" x-model="address" required placeholder="Enter destination crypto address" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-xs font-mono focus:outline-none focus:border-primary-500">
                    </div>

                    <div class="p-3 bg-gray-50 dark:bg-gray-900 rounded-xl text-xs text-gray-500 space-y-1">
                        <div class="flex justify-between"><span>Transfer Fee:</span> <strong>$1.00 USD</strong></div>
                        <div class="flex justify-between"><span>Net Amount to Receive:</span> <strong class="text-green-500 font-bold" x-text="`$` + (Math.max(0, (amount || 0) - 1)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })"></strong></div>
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-primary-500 hover:bg-primary-600 text-white font-bold rounded-xl shadow-md transition">
                        Confirm & Execute Payout
                    </button>
                </form>

            </div>
        </main>
        <nav class="lg:hidden fixed bottom-4 left-4 right-4 z-40 rounded-3xl border border-gray-200 dark:border-white/10 bg-white/95 dark:bg-[#181a24]/95 px-4 py-3 shadow-2xl backdrop-blur-xl" aria-label="Mobile dashboard navigation"><div class="flex items-center justify-around"><a href="index.html" class="flex flex-col items-center gap-1 text-gray-500"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span class="text-[9px] font-bold">Home</span></a><a href="transactions.html" class="flex flex-col items-center gap-1 text-gray-500"><i data-lucide="history" class="w-4 h-4"></i><span class="text-[9px] font-bold">Activity</span></a><a href="deposit.html" class="-mt-7 flex h-12 w-12 items-center justify-center rounded-full border-4 border-gray-50 dark:border-[#0c0c0c] bg-primary-500 text-black shadow-lg" aria-label="Deposit"><i data-lucide="plus" class="w-5 h-5"></i></a><a href="trades.html" class="flex flex-col items-center gap-1 text-gray-500"><i data-lucide="trending-up" class="w-4 h-4"></i><span class="text-[9px] font-bold">Live Trading</span></a><a href="profile.html" class="flex flex-col items-center gap-1 text-gray-500"><i data-lucide="user" class="w-4 h-4"></i><span class="text-[9px] font-bold">Profile</span></a></div></nav>
    </div>
    <script>document.addEventListener('DOMContentLoaded', () => { if(window.lucide) lucide.createIcons(); });</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="../assets/js/ios-transitions.js" defer></script>
</body>
</html>
