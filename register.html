    <script>
        function registrationForm() {
            return {
                currentStep: 0,
                steps: [
                    {
                        title: 'Personal Info',
                        description: 'Basic details',
                        completed: false
                    },
                    {
                        title: 'Location',
                        description: 'Regional settings',
                        completed: false
                    },
                    {
                        title: 'Security',
                        description: 'Account protection',
                        completed: false
                    }
                ],

                nextStep() {
                    if (this.validateCurrentStep()) {
                        this.steps[this.currentStep].completed = true;
                        if (this.currentStep < this.steps.length - 1) {
                            this.currentStep++;
                            this.scrollToTop();
                        }
                    }
                },

                previousStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.scrollToTop();
                    }
                },

                scrollToTop() {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                validateCurrentStep() {
                    const step = this.currentStep;
                    let isValid = true;
                    let missingFields = [];

                    if (step === 0) {
                        // Validate personal information
                        const fields = [
                            { id: 'username', name: 'Username' },
                            { id: 'name', name: 'Full Name' },
                            { id: 'email', name: 'Email' },
                            { id: 'phone', name: 'Phone Number' }
                        ];

                        fields.forEach(field => {
                            const element = document.getElementById(field.id);
                            const value = element.value.trim();
                            if (!value) {
                                missingFields.push(field.name);
                                isValid = false;
                                // Add visual feedback
                                element.classList.add('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                                element.classList.remove('border-gray-300', 'dark:border-gray-600');
                            } else {
                                // Remove error styling if field is now valid
                                element.classList.remove('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                                element.classList.add('border-gray-300', 'dark:border-gray-600');
                            }
                        });

                        // Email validation
                        const emailElement = document.getElementById('email');
                        const email = emailElement.value.trim();
                        if (email && !email.includes('@')) {
                            missingFields.push('Valid Email Format');
                            isValid = false;
                            emailElement.classList.add('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                            emailElement.classList.remove('border-gray-300', 'dark:border-gray-600');
                        }

                    } else if (step === 1) {
                        // Validate location
                        const countryElement = document.getElementById('country');
                        const country = countryElement.value;

                        if (!country || country === 'Select your country') {
                            missingFields.push('Country Selection');
                            isValid = false;
                            countryElement.classList.add('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                            countryElement.classList.remove('border-gray-300', 'dark:border-gray-600');
                        } else {
                            countryElement.classList.remove('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                            countryElement.classList.add('border-gray-300', 'dark:border-gray-600');
                        }

                    } else if (step === 2) {
                        // Validate security
                        const passwordElement = document.getElementById('password');
                        const confirmPasswordElement = document.getElementById('password_confirmation');
                        const agreeElement = document.getElementById('agree');

                        const password = passwordElement.value;
                        const confirmPassword = confirmPasswordElement.value;
                        const agree = agreeElement.checked;

                        // Password validation
                        if (!password) {
                            missingFields.push('Password');
                            isValid = false;
                            passwordElement.classList.add('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                        } else if (password.length < 8) {
                            missingFields.push('Password (minimum 8 characters)');
                            isValid = false;
                            passwordElement.classList.add('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                        } else {
                            passwordElement.classList.remove('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                            passwordElement.classList.add('border-gray-300', 'dark:border-gray-600');
                        }

                        // Confirm password validation
                        if (!confirmPassword) {
                            missingFields.push('Password Confirmation');
                            isValid = false;
                            confirmPasswordElement.classList.add('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                        } else if (password !== confirmPassword) {
                            missingFields.push('Passwords Must Match');
                            isValid = false;
                            confirmPasswordElement.classList.add('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                        } else {
                            confirmPasswordElement.classList.remove('border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                            confirmPasswordElement.classList.add('border-gray-300', 'dark:border-gray-600');
                        }

                        // Terms agreement validation
                        if (!agree) {
                            missingFields.push('Terms & Conditions Agreement');
                            isValid = false;
                        }
                    }

                    if (!isValid) {
                        const message = missingFields.length === 1
                            ? `Please provide: ${missingFields[0]}`
                            : `Please complete these fields: ${missingFields.join(', ')}`;

                        // Show professional alert
                        this.showAlert('Complete Required Fields', message, 'warning');
                    }

                    return isValid;
                },

                showAlert(title, message, type = 'info') {
                    // Simple alert fallback if SweetAlert2 is not available
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({
                            title: title,
                            text: message,
                            icon: type,
                            confirmButtonText: 'Got it',
                            confirmButtonColor: '#FFD100'
                        });
                    } else {
                        alert(`${title}: ${message}`);
                    }
                }
            }
        }

        document.addEventListener('alpine:init', () => {

        document.addEventListener('DOMContentLoaded', function() {
            const country = document.getElementById('country');

            const form = document.getElementById('register');
            if (form) {
                form.addEventListener('submit', function(e) {
                    if (window.supabaseClient) return;
                    const submitBtn = form.querySelector('button[type="submit"]');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin mr-2"></i>Creating Account...';
                    }
                });
            }

            // Auto-scroll to errors if they exist
            const errorSummary = document.querySelector('.bg-primary-500\\/10');
            if (errorSummary) {
                setTimeout(() => {
                    errorSummary.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });

                    // Add a subtle shake animation to draw attention
                    errorSummary.style.animation = 'shake 0.5s ease-in-out';
                }, 100);
            }
        });
    </script>
