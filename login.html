<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="QCgZlPl5K9ZzoWkcG2GKd52vd2OTugHato90WqIJ">
    <title>EXNESS - Sign In</title>
    <meta name="description" content="Sign in to your EXNESS trading account.">
    <meta property="og:title" content="EXNESS - Sign In">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#FFD100">

    <link href="storage/app/public/photos/Px9MifdF6k4uRiyRSGBX6qi4kKWtbhpkYNQrAouw.png" rel="icon" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="assets/js/tailwindcss.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#FFFDF0', 100: '#FFF9C2', 200: '#FFF085', 300: '#FFE247',
                            400: '#FFD100', 500: '#FFD100', 600: '#E5BC00', 700: '#B79000',
                            800: '#8A6900', 900: '#5C4400',
                        },
                        gray: {
                            50: '#FFFFFF', 100: '#F5F5F5', 200: '#E5E5E5', 300: '#D4D4D4',
                            400: '#A3A3A3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#0F0F0F',
                        },
                    },
                }
            }
        }
    </script>

    <script defer src="assets/js/alpine.min.js"></script>
    <script src="assets/js/lucide.min.js"></script>
    <script src="assets/js/icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="assets/js/supabase-client.js" defer></script>
    <script src="assets/js/fast-nav.js" defer></script>

    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { overflow-x: hidden; top: 0 !important; }
        [x-cloak] { display: none !important; }
        .skiptranslate { display: none !important; }
    </style>
</head>

<body class="auth-page h-full font-sans antialiased transition-colors duration-300">

    <!-- Theme Toggle -->
    <div class="fixed top-4 right-4 z-50">
        <button
            @click="$store.theme.toggle($event)"
            class="relative inline-flex items-center justify-center w-10 h-10 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors duration-150"
            :aria-pressed="$store.theme.darkMode || $store.theme.dark"
            x-cloak>
            <svg x-cloak x-show="!$store.theme.darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 12.728l-.707-.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg x-cloak x-show="$store.theme.darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
    </div>

    <!-- Page -->
    <div class="relative min-h-screen flex items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
        <div class="w-full max-w-md">

            <!-- Card -->
            <div class="relative bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl p-8 sm:p-10 shadow-2xl">

                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="flex items-center justify-center mb-4">
                        <a href="index.html">
                            <img src="assets/images/exness-logo.png" class="h-12 w-auto" alt="EXNESS">
                        </a>
                    </div>
                    <h1 id="login-title-heading" class="text-2xl font-bold text-gray-900 dark:text-white">Sign In</h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Welcome back! Please enter your credentials.</p>
                </div>

                <!-- Form -->
                <form action="#" method="post" class="space-y-5" id="login">
                    <input type="hidden" name="_token" value="QCgZlPl5K9ZzoWkcG2GKd52vd2OTugHato90WqIJ">

                    <!-- Email -->
                    <div class="space-y-1.5">
                        <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-200">
                            Email Address or Username
                        </label>
                        <input type="text" name="email" id="email" required
                               class="block w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-4 py-3.5 text-gray-900 dark:text-white placeholder-gray-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm"
                               placeholder="Enter your email or username">
                    </div>

                    <!-- Password -->
                    <div class="space-y-1.5">
                        <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-200">Password</label>
                        <div class="relative" x-data="{ showPassword: false }">
                            <input type="password" name="password" id="password" required
                                   :type="showPassword ? 'text' : 'password'"
                                   class="block w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-4 pr-11 py-3.5 text-gray-900 dark:text-white placeholder-gray-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm"
                                   placeholder="Enter your password">
                            <button type="button" @click="showPassword = !showPassword"
                                    class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
                                <i data-lucide="eye" class="h-4 w-4" x-show="!showPassword"></i>
                                <i data-lucide="eye-off" class="h-4 w-4" x-show="showPassword" x-cloak></i>
                            </button>
                        </div>
                    </div>

                    <!-- Sign-in preferences -->
                    <div class="flex items-center justify-between gap-4 pt-0.5">
                        <label for="remember" class="inline-flex cursor-pointer items-center gap-2.5 text-sm leading-5 text-gray-600 dark:text-gray-300">
                            <input type="checkbox" name="remember" id="remember"
                                   class="h-4 w-4 shrink-0 accent-yellow-500 focus:ring-primary-500/20">
                            <span>Remember me</span>
                        </label>
                        <a href="forgot-password.html" class="shrink-0 py-1 text-sm font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400 transition-colors">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Submit -->
                    <div class="pt-2">
                        <button type="submit"
                                class="w-full flex justify-center items-center gap-2 rounded-xl bg-primary-500 hover:bg-primary-600 px-6 py-3.5 text-sm font-bold text-gray-900 transition-all duration-200 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                            <span>Sign In</span>
                            <i data-lucide="arrow-right" class="h-4 w-4"></i>
                        </button>
                    </div>
                </form>

                <!-- Footer -->
                <div class="mt-6 pt-5 border-t border-gray-200 dark:border-gray-700/60 text-center">
                    <p class="text-sm text-gray-600 dark:text-gray-300">
                        Don't have an account?
                        <a href="register.html" class="font-bold text-primary-500 hover:text-primary-600 dark:text-primary-400 underline underline-offset-2">Sign up</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('theme', {
                init() {
                    this.darkMode = localStorage.getItem('theme') === 'dark';
                    this.dark = this.darkMode;
                },
                darkMode: false,
                dark: false,
                toggle(trigger) {
                    if (window.toggleDashboardTheme) {
                        window.toggleDashboardTheme(trigger);
                        this.darkMode = document.documentElement.classList.contains('dark');
                        this.dark = this.darkMode;
                    } else {
                        this.darkMode = !this.darkMode;
                        this.dark = this.darkMode;
                        this.updateTheme();
                    }
                },
                updateTheme() {
                    localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
                    document.documentElement.classList.toggle('dark', this.darkMode);
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            if (window.location.search.includes('admin=1')) {
                const heading = document.getElementById('login-title-heading');
                if (heading) heading.textContent = 'Administrator Login';
            }
            const emailField = document.getElementById('email');
            if (emailField) emailField.focus();
        });

        document.addEventListener('alpine:updated', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>

    <div class="gtranslate_wrapper"></div>
    <script>
        window.gtranslateSettings = {
            default_language: 'en',
            alt_flags: { en: 'usa' },
            wrapper_selector: '.gtranslate_wrapper',
            flag_style: '3d'
        };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

</body>
</html>
